name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer Cython

      - name: Build APK (первый раз идёт ~30 мин)
        run: |
          python -m buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wildvantage-apk
          path: bin/*.apk
          if-no-files-found: error