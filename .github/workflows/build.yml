name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev

      - name: Use Java 17 for Gradle
        shell: bash
        run: |
          if [ -n "$JAVA_HOME_17_X64" ]; then
            echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          else
            sudo update-alternatives --set java /usr/lib/jvm/java-17-openjdk-amd64/bin/java
            echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          fi
          java -version

      - name: Prepare Android SDK & NDK (synchronous, no buildozer race)
        shell: bash
        run: |
          set -e
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          PLATFORM="$HOME/.buildozer/android/platform"
          mkdir -p "$SDK/cmdline-tools" "$PLATFORM"
          curl -sL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf /tmp/clt
          unzip -q -o /tmp/clt.zip -d /tmp/clt
          rm -rf "$SDK/cmdline-tools/latest"
          mv /tmp/clt/cmdline-tools "$SDK/cmdline-tools/latest"
          # buildozer 1.6 ищет sdkmanager по старому пути <sdk>/tools/bin/sdkmanager
          rm -rf "$SDK/tools"
          ln -s "$SDK/cmdline-tools/latest" "$SDK/tools"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "platform-tools" "platforms;android-31" "build-tools;34.0.0" || true
          test -d "$SDK/platforms/android-31" || { echo "platform android-31 missing"; exit 1; }
          test -x "$SDK/platform-tools/adb" || { echo "platform-tools missing"; exit 1; }
          test -L "$SDK/tools" && { echo "tools symlink OK"; }
          if [ ! -f "$PLATFORM/android-ndk-r25b/source.properties" ]; then
            rm -rf "$PLATFORM/android-ndk-r25b"
            curl -sL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
            unzip -q -o /tmp/ndk.zip -d "$PLATFORM"
          fi
          test -f "$PLATFORM/android-ndk-r25b/source.properties" || { echo "NDK incomplete"; exit 1; }
          ls "$PLATFORM"

      - name: Cache Android SDK & NDK (~/.buildozer)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-sdk-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-sdk-

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer Cython

      - name: Cache p4a build dir
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Build APK (первый раз идёт ~30 мин)
        run: |
          python -m buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wildvantage-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Determine version from buildozer.spec
        id: ver
        run: |
          ver=$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' buildozer.spec | head -1 | tr -d ' \r')
          echo "APK_VERSION=$ver" >> "$GITHUB_ENV"
          echo "TAG=v${ver}-test" >> "$GITHUB_ENV"
          echo "version=$ver"

      - name: Prepare release APK (arm64-v8a by preference)
        run: |
          src=$(ls bin/*arm64* 2>/dev/null | head -1)
          if [ -z "$src" ]; then src=$(ls bin/*.apk 2>/dev/null | head -1); fi
          echo "source=$src"
          cp "$src" "bin/WILDVANTAGE-v${APK_VERSION}.apk"
          ls -la bin/

      - name: Check if test release already exists
        id: chk
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}")
          echo "api_status=$code"
          if [ "$code" = "200" ]; then echo "EXISTS=1" >> "$GITHUB_ENV"; else echo "EXISTS=0" >> "$GITHUB_ENV"; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create test prerelease v${{ env.APK_VERSION }}-test
        if: success() && env.EXISTS == '0'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.APK_VERSION }}-test
          name: WildVantage v${{ env.APK_VERSION }} (тестовый prerelease)
          body: |
            Тестовая сборка WildVantage v${{ env.APK_VERSION }}.

            Изменения в v13.0.1:
            - фикс краша на старте (MDIcon импортируется из kivymd.uix.label, а не несуществующего kivymd.uix.icon);
            - защита сетевых/GPS колбэков и стартового чтения кэша от падения процесса.
          draft: false
          prerelease: true
          files: bin/WILDVANTAGE-v${{ env.APK_VERSION }}.apk
          fail_on_unmatched_files: true